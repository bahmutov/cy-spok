name: main
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - uses: actions/checkout@v7
      - uses: cypress-io/github-action@v7.4.8
        with:
          build: npm run typecheck

  test-esbuild:
    runs-on: ubuntu-latest
    name: Build and test
    steps:
      - uses: actions/checkout@v7
      - uses: cypress-io/github-action@v7.4.8
        with:
          config-file: cypress-esbuild.config.js

  release:
    needs: [test, test-esbuild]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      # allow the release step to comment on
      # issues, pull requests, and write to the repo
      contents: write
      issues: write
      pull-requests: write
      # Required for OIDC to let NPM registry know
      # that this workflow is trusted
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Install only the semantic release 📦
        run: npm install semantic-release

      # https://github.com/cycjimmy/semantic-release-action
      - name: Semantic Release 🚀
        uses: cycjimmy/semantic-release-action@v8.1.3
        with:
          branches: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
